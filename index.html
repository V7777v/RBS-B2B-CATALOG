    <script>
      (function() {
        // 1. Mock WebSocket for Vite HMR to prevent failing connection attempts in iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isVite = protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1));
            if (isVite) {
              var listeners = {};
              var mockSocket = {
                readyState: 1, // OPEN
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                url: String(url),
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                addEventListener: function(type, cb) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(cb);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { cb({ type: 'open', target: mockSocket }); } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, cb) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(fn) { return fn !== cb; });
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {},
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              return mockSocket;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Intercept window error & unhandledrejection events for [vite]
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? String(e.message) : '';
          if (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason ? String(e.reason.message || e.reason) : '';
          if (reason.indexOf('[vite]') !== -1 || reason.indexOf('websocket') !== -1 || reason.indexOf('WebSocket') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        // 3. Suppress Vite HMR / WebSocket messages in console
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var str = String(arguments[i] && (arguments[i].message || arguments[i]) || '');
            if (str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
              return;
            }
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var str = String(arguments[i] && (arguments[i].message || arguments[i]) || '');
            if (str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
              return;
            }
          }
          return origWarn.apply(console, arguments);
        };
      })();
    </script>
