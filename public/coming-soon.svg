<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="cs-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="cs-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- White die-cut sticker edge -->
  <circle cx="60" cy="60" r="54" fill="#ffffff" filter="url(#cs-shadow)"/>
  
  <!-- Colored inner badge -->
  <circle cx="60" cy="60" r="48" fill="url(#cs-bg)"/>
  
  <!-- Stitched / dashed inner ring -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65"/>

  <!-- Glossy light sheen -->
  <path d="M 20,48 A 48,48 0 0,1 100,48 A 45,24 0 0,0 20,48 Z" fill="url(#cs-sheen)"/>

  <!-- Star sparkle -->
  <path d="M 60,20 L 61.5,24.5 L 66,24.5 L 62.5,27 L 64,31.5 L 60,28.5 L 56,31.5 L 57.5,27 L 54,24.5 L 58.5,24.5 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Hebrew label -->
  <text x="60" y="67" text-anchor="middle" font-family="Assistant, Rubik, 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="23" fill="#ffffff" letter-spacing="0.5">בקרוב!</text>
  <text x="60" y="83" text-anchor="middle" font-family="Assistant, Rubik, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="9" fill="#fecdd3" letter-spacing="1.2">COMING SOON</text>
</svg>
